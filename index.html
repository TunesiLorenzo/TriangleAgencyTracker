<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triangle Agency</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/effects.css">
  <link rel="stylesheet" href="./css/graphs.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div id="backgroundHue" aria-hidden="true">
    <video id="bgVideo1" src="./images/bck_calm.mp4" autoplay muted loop playsinline></video>
    <video id="bgVideo2" class="secondary-background" autoplay muted loop playsinline></video>
  </div>

  <main id="pageWrapper">
    <div class="container">
      <h1>Welcome, agents of the <br> TRIANGLE AGENCY</h1>

      <nav class="top-buttons-left" aria-label="Agent controls">
        <button id="addAgentButton" type="button">Hire Agent</button>
        <button id="loadAgentButton" type="button">Recall Agent</button>
        <button id="exportAgentButton" type="button">Agent CV</button>
      </nav>
      <nav class="top-buttons-right" aria-label="Team controls">
        <button id="resetButton" type="button">Close Branch</button>
        <button id="loadTeamButton" type="button">Recall Team</button>
        <button id="exportTeamButton" type="button">Team CV</button>
      </nav>

      <div class="workspace">
        <aside id="taskPanel" aria-label="Tasks"></aside>
        <section class="characters" id="charContainer" aria-label="Agents"></section>
      </div>

      <section class="world-section" aria-label="Branch status">
        <div class="world">
          <div class="sphere-icon">&#127760;</div>
          <label>LOCAL BRANCH: <input type="text" id="branchName"></label>
          <div class="world-counter">&#128065;&#65039; WITNESSES: <span class="counter" id="witnessCounter">0</span><span class="witness-flash" id="witnessFlash" aria-hidden="true">&#128065;&#65039;</span></div>
          <div class="world-counter">&#127744; CHAOS: <span class="counter" id="chaosCounter">0</span></div>
        </div>

        <div class="graph-box" data-panel="mission-timeline" aria-label="Mission Timeline">
          <h3 class="graph-title">Mission Timeline</h3>
          <canvas id="lineGraph" width="300" height="150"></canvas>
        </div>
        <div class="graph-box" data-panel="agent-performance" aria-label="Agent Performance">
          <h3 class="graph-title">Agent Performance</h3>
          <canvas id="histGraph" width="300" height="150"></canvas>
        </div>
        <div class="graph-box" data-panel="mission-risk" aria-label="Mission Risk">
          <h3 class="graph-title">Mission Risk</h3>
          <canvas id="pieGraph" width="200" height="200"></canvas>
        </div>
      </section>
    </div>
  </main>

  <div id="scanlineOverlay" aria-hidden="true"></div>
  <div id="crtScanline" aria-hidden="true"></div>
  <div id="chaosPulseOverlay" aria-hidden="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
